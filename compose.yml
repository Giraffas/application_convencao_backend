services:
  application-eventos-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application-eventos-backend
    env_file:
      - .env
    restart: unless-stopped
    init: true
    command: ["node", "/app/server.js"]
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - automacoes-ti-internal

networks:
  automacoes-ti-internal:
    external: true
