services:
  application-eventos-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application-eventos-backend
    env_file:
      - .env
    restart: unless-stopped
    init: true
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - automacoes-ti-internal
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.application-eventos-backend.schedule: "@every 10s"
      ofelia.job-exec.application-eventos-backend.command: "node /app/server.js"
      ofelia.job-exec.application-eventos-backend.user: "10001:10001"
      ofelia.job-exec.application-eventos-backend.no-overlap: "true"

networks:
  automacoes-ti-internal:
    external: true
